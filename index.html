<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>谢谢hm</title>
    <style>
      :root {
        --bg1: #0f172a;
        --bg2: #1e293b;
        --accent: #f472b6;
        --soft: #f9a8d4;
        --text: #f8fafc;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        background: linear-gradient(135deg, var(--bg1), var(--bg2));
        color: var(--text);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
      }

      .shell {
        width: min(1100px, 100%);
      }

      .hero {
        text-align: center;
        padding: 40px 20px 22px;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(2.8rem, 6vw, 5.2rem);
        letter-spacing: 0.12em;
        text-shadow: 0 0 18px rgba(249,168,212,0.7);
      }

      .hero p {
        margin: 18px 0 0;
        font-size: clamp(1rem, 2vw, 1.4rem);
        letter-spacing: 0.12em;
        color: var(--soft);
      }

      .players {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 22px;
        margin-top: 18px;
      }

      .player-card {
        background: rgba(15, 23, 42, 0.45);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 20px;
        padding: 18px 16px 10px;
        box-shadow: 0 18px 40px rgba(0,0,0,0.25);
        backdrop-filter: blur(8px);
      }

      .label {
        display: block;
        margin-bottom: 12px;
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #fdf2f8;
      }

      iframe {
        width: 100%;
        min-height: 150px;
        border: 0;
        border-radius: 12px;
      }

      .note {
        margin-top: 18px;
        text-align: center;
        color: rgba(255,255,255,0.7);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="hero">
        <h1>谢谢hm</h1>
        <p>听我说谢谢你</p>
      </div>

      <div class="players">
        <div class="player-card">
          <span class="label">Spotify</span>
          <iframe
            src="https://open.spotify.com/embed/track/1UIblrzE4VmVJeRdKr2ZB2?si=i96QBcKCShKBUAgUwns9-w"
            width="100%"
            height="152"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>

        <div class="player-card">
          <span class="label">YouTube</span>
          <iframe
            src="https://www.youtube.com/embed/HyNxy4zT5WU"
            width="100%"
            height="315"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
            loading="lazy"
          ></iframe>
        </div>
      </div>

      <div class="note">
        GitHub Pages 上最稳定的播放方式是使用可嵌入播放器，不直接依赖裸 MP3 直链。
      </div>
    </div>
  </body>
</html>
